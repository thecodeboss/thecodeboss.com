# yaml-language-server: $schema=https://json.schemastore.org/github-workflow
name: Deploy
on:
  push:
    branches:
      - main
concurrency:
  group: deploy-prod
  cancel-in-progress: false
jobs:
  deploy:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Check Out Repository
        uses: actions/checkout@v6
      - name: Set Up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Set Up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Install Dependencies
        run: bun install --frozen-lockfile
      - name: Build Frontend
        run: bun run build
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: us-west-1
          role-to-assume: arn:aws:iam::191767792151:role/GitHubActionsRole
      - name: Deploy Infrastructure
        uses: pulumi/actions@v6
        id: pulumi
        with:
          command: up
          pulumi-version: 3.227.0
          stack-name: thecodeboss/thecodeboss.com/prod
          work-dir: ./infra
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id ${{ steps.pulumi.outputs.distributionId }} --paths "/*"
